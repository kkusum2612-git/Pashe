
spring:
  application:
    name: pashe

  datasource:
    url: jdbc:postgresql://localhost:${DB_HOST_PORT:5433}/${DB_NAME:pashe_db}
    username: ${DB_USERNAME:pashe}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080
